name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # npx crashes on the runner's npm ("Cannot read properties of null (reading 'edgesOut')")
      - run: npm install --no-save --prefix "$RUNNER_TEMP/tools" html-validate@10.17.0
      - run: '"$RUNNER_TEMP/tools/node_modules/.bin/html-validate" index.html'
